cli_help:
  heading:
    usage: "Usage:"
    subcommands: "Subcommands"
    options: "Options"
    arguments: "Arguments"
  after_help: "Type 'hok help <command>' to get help for a specific command."
  help:
    about: "Print this message or the help of the given subcommand(s)"
  hok:
    about: "Hok is a CLI implementation of Scoop in Rust"
    args:
      confirm: "Force the transaction confirmation gate, ignoring the confirm config"
      language: "Force CLI language (auto/en/zh)"
      no_color: "Disable colored output"
      verbose: "Increase logging verbosity"
      quiet: "Decrease logging verbosity"
      help: "Print help"
      version: "Print version"
  alias:
    args:
      add: Add a new alias
      add.name: Alias name
      add.value: Command to execute
      add.description: Alias description (written as the script's `# Summary:` line)
      list: List all aliases (default)
      list.verbose: Show the alias description column
      remove: Remove an alias
      remove.name: Alias name to remove
    about: "List, add, or remove Scoop aliases"
    long_about: "List, add, or remove Scoop aliases\n\nExamples:\n  hok alias list                   list all aliases\n  hok alias add <name> <command>   add an alias\n  hok alias rm  <name>            remove an alias"
  bucket:
    about: Manage manifest buckets
    args:
      add: Add a bucket
      add.name: The bucket name
      add.repo: The bucket repository url (optional for known buckets)
      list: List buckets
      list.known: List known buckets
      known: "List known buckets (Scoop: scoop bucket known)"
      remove: Remove bucket(s)
      remove.name: The bucket name(s)
  cache:
    about: Package cache management
    args:
      app: "App name(s) whose caches are listed (default: all)"
      list: List download caches
      list.app: List caches of the given app(s)
      remove: Remove download caches
      remove.all: Remove all caches
      remove.app: Remove caches of the given app(s)
  cat:
    args:
      package: Name of the package to be inspected
    about: Inspect the manifest of a package
  checkhashes:
    about: Verify and update manifest hashes
    long_about: |-
      Walks the manifests under `--dir`, downloads every URL they declare and compares the computed digest with the `hash` field, mirroring Scoop's `bin/checkhashes.ps1`. Manifests that declare a top-level `url` are checked against it alone; the rest are checked per architecture (64bit, 32bit, arm64).
      With `--update` a manifest whose hashes do not match is rewritten in place (CRLF, trailing newline preserved), while `--force` also rewrites manifests whose hashes are already correct.
    args:
      app: |-
        Specific app(s) to check (supports wildcards, default: all)
        Matching is case-insensitive, like Scoop's `-App` filter; multiple patterns are accepted and OR-ed together.
      cache: |-
        Use cache directory for downloaded files
        Defaults to a temporary directory that is removed at the end of the run unless `--keep-cache` is given.
      dir: |-
        Bucket directory to scan for manifests
        Defaults to the current directory, but required with `--update`/`--force` (which rewrite manifests) or hok refuses to run.
      force: |-
        Force update manifest even when hash matches
        Downloads are always re-fetched with this flag, even together with `--keep-cache`.
      keep_cache: |-
        Keep downloaded files after the check completes
        Equivalent to Scoop's `-UseCache`: the next run reuses the cached files instead of downloading them again, so it may check an already out-of-date file. The cache is keyed by manifest version.
      skip_correct: Suppress output for manifests with correct hashes
      update: Update manifest with correct hash when mismatch found
  checkup:
    about: Check for potential problems
  checkurls:
    about: Check manifest URLs for validity
    args:
      app: "Specific app(s) to check (supports wildcards, default: all)"
      dir: Bucket directory to scan for manifests
      skip_valid: Only show invalid URLs (suppress valid ones)
      timeout: Request timeout in seconds
  checkver:
    about: Check manifest for a newer version
    args:
      app: "Specific app(s) to check (supports wildcards, default: all)"
      dir: |-
        Bucket directory to scan for manifests
        Defaults to the current directory, but required with `--update`/`--force-update` (which rewrite manifests) or hok refuses to run.
      update: Update manifest with new version and trigger autoupdate
      force_update: Force update even when version is unchanged (useful for hash updates)
      skip_updated: Skip manifests that are already up-to-date
      version: Update manifest to specific version (skip version detection)
      timeout: Request timeout in seconds
      throw_error: Throw on the first error instead of reporting it and continuing
  cleanup:
    about: Cleanup apps by removing old versions
    args:
      app: Given named app(s) to be cleaned up
      all: Cleanup all apps (alternative to '*')
      global: Cleanup a globally installed app
      cache: Remove download cache simultaneously
      list: List the installed versions instead of cleaning them
  completions:
    args:
      shell: The shell type
    about: Generate shell completions
  config:
    about: Configuration management
    long_about: |-
      Configuration management

      Config file: ~/.config/hok/config.json

      Settings
      --------

      aria2-enabled: bool, default true
            Enable fragmented downloads (hok's built-in HTTP range splitter).
      aria2-split: int, default 5
            Number of connections used for each fragmented download.
      aria2-max-connection-per-server: int, default 5
            Maximum number of connections to one server per download.
      aria2-min-split-size: size, default 5M
            Minimum file size to trigger fragmented downloads (e.g. 5M, 10M).
      jobs: int, default 4
            Number of packages downloaded concurrently in the download phase.
      cache_path: path, default $SCOOP_CACHE or <root>/cache
            Download cache directory.
      cat_style: string, default none
            When set, use 'bat' to display manifests (requires bat installed).
      editor: string, default none
            Editor used by 'hok config edit' ($EDITOR then the OS handler fall back).
      confirm: bool, default false
            Ask for confirmation before a sync operation runs.
      default_architecture: 64bit|32bit|arm64, default auto-detected
            Preferred architecture used for installation.
      global_path: path, default $SCOOP_GLOBAL or %ProgramData%\scoop
            Root directory for globally installed apps.
      gh_token: string, default none
            GitHub API token used for authenticated requests.
      ignore_failures: bool, default false
            Continue multi-package operations despite individual failures.
      ignore_running_processes: bool, default false
            Proceed even if the app is running (warning instead of abort).
      language: auto|en|zh, default auto
            CLI language for messages and help text.
      last_update: string, internal
            Timestamp of the last bucket update (managed by hok).
      no_color: bool, default false
            Disable colored output.
      no_junction: bool, default false
            Do not use the 'current' junction; shims point to version dirs instead.
      private_hosts: array, edit file
            Private hosts needing extra auth headers; edit the config file directly.
      proxy: string, default none
            Proxy settings: none | default | currentuser | [username:password@]host:port.
      root_path: path, default $SCOOP or ~/scoop
            Scoop root directory.
      script_engine: bool, default false
            Reuse one resident pwsh process for installer/uninstaller scripts.
      use_isolated_path: bool|string, default none
            Store apps' PATH entries in a dedicated env var (SCOOP_PATH by default).
      use_sqlite_cache: bool, default false
            Use SQLite database for manifest caching (Scoop-compatible schema).
      virustotal_api_key: string, default none
            VirusTotal API key used for uploading/scanning files.

      Bare 'hok config' prints the settings the config file holds, one
      'key = value' line each; '-j' prints the same as JSON and '-a' lists
      every known setting with its effective default. A setting is written
      with 'hok config <key> <value>' and removed with 'hok config rm <key>',
      the shapes upstream 'scoop config' uses. private_hosts and last_update
      are only editable in the file.

      Setting names are used exactly as listed above; there are no aliases.
      'hok config edit' is a hok extension (upstream reads 'edit' as a key
      name) and so are '-j' / '-a'.
    args:
      json: Print the settings as JSON
      all: List every setting with its effective default
      key: Print this setting, or write it when a value follows
      value: The new value for <KEY>
      edit: "Edit the config file [default: system default editor]"
      rm: Remove a setting from the config file
      rm.key: The key of the setting
  create:
    about: "Create a manifest from a download URL"
    long_about: Downloads the file, computes its hash, and generates a manifest skeleton.
    args:
      url: Download URL
      output: "Optional output file (default: stdout)"
  depends:
    args:
      package: Name of the package
      arch: "Use the specified architecture (32bit/64bit/arm64), overriding the detected default"
    about: Show dependencies of a package
  download:
    about: Download apps in the cache folder and verify hashes
    long_about: |-
      Download app files into the cache directory without installing them
      (uses your local 'buckets'):
           hok download git

      To download a different version of the app
      (note that this will auto-generate the manifest using the current version):
           hok download gh@2.7.0

      To download an app from a manifest at a URL:
           hok download https://raw.githubusercontent.com/ScoopInstaller/Main/master/bucket/runat.json

      To download an app from a manifest on your computer:
           hok download \path\to\app.json
    args:
      package: The package(s) to download (name, bucket/name, name@version, or manifest URL/path)
      force: Force download (overwrite cache)
      skip_hash_check: Skip package integrity check (use with caution!)
      arch: "Use the specified architecture (32bit/64bit/arm64), overriding the detected default"
  export:
    about: Export installed packages list
    args:
      config: "Export the configuration too (upstream 'scoop export -c')"
      hok: Append hok's own extension (config and per-app state); Scoop ignores it, hok restores it exactly
  formatjson:
    about: Format manifest JSON files in a bucket directory
    args:
      app: "Specific app(s) to format (wildcards and .json optional, case-insensitive; default: all)"
      dir: |-
        Bucket directory to scan for manifests
        Required: this command rewrites every manifest it finds in place, and the scan is a recursive `*.json` walk that cannot tell a manifest from any other JSON file.
  health:
    about: Check for potential problems with installed packages
  hold:
    about: Hold package(s) to disable changes
    args:
      global: Hold globally installed app (from $SCOOP_GLOBAL)
      package: The package(s) to be held
  home:
    args:
      package: The package name
    about: Browse the homepage of a package
  import:
    args:
      file: "Scoopfile to import from: a local path, an http(s) URL, or a UNC path"
    about: Import installed packages from a Scoopfile
  info:
    args:
      query: The app name (`bucket/name` also accepted), a manifest URL or a local manifest path
      verbose: Show full paths and URLs
    about: Display information about an app
  install:
    about: Install package(s)
    long_about: |-
      Install package(s) from your local buckets, a manifest URL, or a local
      manifest file.

      The usual way to install an app (uses your local 'buckets'):
           hok install git

      To install a different version of the app
      (note that this will auto-generate the manifest using the current version):
           hok install gh@2.7.0

      To install an app from a manifest at a URL:
           hok install https://raw.githubusercontent.com/ScoopInstaller/Main/master/bucket/runat.json

      To install a different version of the app from a URL:
           hok install https://raw.githubusercontent.com/ScoopInstaller/Main/master/bucket/neovim.json@0.9.0

      To install an app from a manifest on your computer:
           hok install \path\to\app.json
           hok install \path\to\app.json@version
    args:
      arch: "Use the specified architecture (32bit/64bit/arm64), overriding the detected default"
      assume_yes: Assume yes to all prompts and run non-interactively
      download_only: Download package(s) without performing installation
      global: Install globally (to $SCOOP_GLOBAL)
      no_cache: "Don't use the download cache"
      ignore_failures: "Ignore failures to ensure a complete transaction (persistent setting: 'hok config ignore_failures true')"
      independent: "Don't install dependencies automatically"
      skip_hash_check: Skip package integrity check
      no_replace: Do not replace package(s)
      no_upgrade: Do not upgrade package(s)
      offline: Leverage cache and suppress network access
      package: "The package(s) to install (name, bucket/name, name@version, or a manifest URL/path)"
  list:
    about: List installed package(s)
    args:
      explicit: Turn regex off and use explicit matching
      held: List held package(s)
      query: The query string (regex supported by default)
      upgradable: List upgradable package(s)
      versions: Show all installed versions (not just current)
  missing_checkver:
    about: Check bucket manifests missing checkver and autoupdate
    args:
      app: "Specific app(s) to check (wildcards and .json optional, case-insensitive; default: all)"
      dir: Bucket directory to scan for manifests
      skip_supported: Skip manifests that have both checkver and autoupdate
  prefix:
    args:
      package: Name of the package
    about: Show the directory where a package is installed
  reinstall:
    about: Reinstall a package
    args:
      global: Install globally (to $SCOOP_GLOBAL)
      no_cache: "Don't use the download cache"
      ignore_failures: "Ignore failures to ensure a complete transaction (persistent setting: 'hok config ignore_failures true')"
      skip_hash_check: Skip package integrity check
      offline: Leverage cache and suppress network access
      package: The package(s) to reinstall
  reset:
    args:
      app: The app name
      version: A specific version to reset to
      all: Reset all installed apps
    about: "Reset an app to resolve conflicts (reapply shims, shortcuts, post_install)"
  search:
    about: "Search available package(s)"
    long_about: "Search available package(s) from synced buckets. The query is performed against package names by default, use --with-description or --with-binary to search through package descriptions or binaries."
    args:
      explicit: Turn regex off and use explicit matching
      query: The query string (regex supported by default)
      with_binary: Search through package binaries as well
      with_description: Search through package descriptions as well
  shim:
    about: List or inspect shims
    long_about: |-
      Manipulate Scoop shims (add / remove / list / inspect).

      Examples:
        hok shim add <name> <target> [args...]  add a custom shim pointing at an
                                                arbitrary command path (or a name
                                                resolved through PATH)
        hok shim rm <name>...                   remove shims (CAUTION: may remove
                                                shims created by an app manifest)
        hok shim list [<regex_pattern>...]      list all shims or matching shims
        hok shim info <name>                    show a shim's information

      -g/--global may appear anywhere before `--`, so `hok shim -g list` and
      `hok shim list -g` are the same command listing only global shims.
      `hok shim list *` lists every shim.

      HINT: the first `--`, if any, is treated as the POSIX-style command
      option terminator and is NOT included in the shim arguments, so pass
      arguments starting with `-` after it:
        hok shim add myapp D:\\path\\myapp.exe -- --global
    args:
      global: Manipulate global shim(s)
      add: Add a custom shim
      add.long_about: "`hok shim add <name> <target> [args...]` — arguments starting with `-` must follow a `--` (POSIX-style option terminator); `-g`/`--global` itself is hok's option, so to pass it to the shim put it after the `--`."
      add.parts: "`<name> <target> [args...]` — name, then the target command path (or a name resolved through PATH), then any args"
      remove: "Remove shims (CAUTION: may remove shims created by an app manifest)"
      remove.names: Shim name
      list: List all shims (default), optionally filtered by regex pattern(s)
      list.patterns: Regex pattern(s) to filter by
      info: Show shim information for a specific app
      info.name: Shim name
  status:
    about: Show the status of all installed apps
    args:
      all: "Also show up-to-date apps (default: only outdated)"
  unhold:
    about: Unhold package(s) to enable changes
    args:
      global: Unhold globally installed app (from $SCOOP_GLOBAL)
      package: The package(s) to be unheld
  uninstall:
    about: Uninstall package(s)
    args:
      assume_yes: Assume yes to all prompts and run non-interactively
      global: Uninstall a globally installed app (from $SCOOP_GLOBAL)
      ignore_failures: "Ignore failures to ensure a complete transaction (persistent setting: 'hok config ignore_failures true')"
      skip_hash_check: Skip package integrity check
      package: The package(s) to uninstall
      purge: Remove all persistent data
  update:
    about: "Fetch and update subscribed buckets, or upgrade installed package(s)"
    long_about: "Fetch and update subscribed buckets, or upgrade installed package(s)\n\nExamples:\n  hok update         update buckets only\n  hok update <app>   upgrade a specific package (Scoop-compatible)\n  hok update *       upgrade all packages"
    args:
      assume_yes: Assume yes to all prompts and run non-interactively
      force: "Force update even when there isn't a newer version"
      no_cache: "Don't use the download cache"
      ignore_failures: "Ignore failures to ensure a complete transaction (persistent setting: 'hok config ignore_failures true')"
      independent: "Don't install dependencies automatically"
      skip_hash_check: Skip package integrity check
      no_replace: Do not replace package(s)
      no_upgrade: Do not upgrade package(s)
      offline: Leverage cache and suppress network access
      package: The package(s) to be upgraded (omit to only update buckets)
      global: Install globally (to $SCOOP_GLOBAL)
      all: Update all installed packages (alternative to '*')
  upgrade:
    about: Upgrade installed package(s)
    args:
      all: Update all installed packages (alternative to '*')
      assume_yes: Assume yes to all prompts and run non-interactively
      force: "Force upgrade: reinstall apps that are already at the requested version"
      global: Install globally (to $SCOOP_GLOBAL)
      ignore_failures: "Ignore failures to ensure a complete transaction (persistent setting: 'hok config ignore_failures true')"
      independent: "Don't install dependencies automatically"
      no_cache: "Don't use the download cache"
      skip_hash_check: Skip package integrity check
      offline: Leverage cache and suppress network access
      package: "The package(s) to be upgraded (default: all except held)"
  virustotal:
    about: "Check a package's download URL against VirusTotal"
    long_about: |-
      Requires a VirusTotal API key. Set it with:
        hok config virustotal_api_key <key>
      Or set the $VT_API_KEY environment variable.
    args:
      app: Package name(s) to check
  which:
    about: Show the shim location(s) of a command
    args:
      command: Command name to search for
  auto_pr:
    about: "Auto-update manifests and create pull-requests via GitHub API (zero external binary, CI mode)"
    long_about: This command runs in CI environments (e.g., GitHub Actions) and uses the GitHub API exclusively — no git/hub binary required.
    args:
      dir: Bucket directory to scan for manifests
      upstream: "Upstream repository with target branch (<user>/<repo>:<branch>)"
      push: Push updates directly to origin branch
      request: Create pull-requests for each update
      origin_branch: Origin (local) branch name
      message: "Commit message format (<app> and <version> are replaced)"
      skip_updated: Skip manifests that are already up-to-date
      special: Force update on these special snowflakes (comma-separated)
      token: "GitHub Token (default from GITHUB_TOKEN env var)"
      app_slug: "GitHub App slug (e.g. `my-bot`); used to generate the DCO sign-off for the corresponding bot user when the token is a GitHub App installation token"
      verbose: Show per-manifest checkver details (versions found, updates, errors)

# Command aliases (for shell completions)
cli_alias:
  bucket:
    List: [ls]
    Remove: [rm]
  cache:
    List: [ls]
    Remove: [rm]
  config:
    List: [ls]
  search: [s]
  uninstall: [rm, remove]
  update: [u]
