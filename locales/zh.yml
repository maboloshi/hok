    about: "列出、添加或删除 Scoop 别名"
    long_about: "列出、添加或删除 Scoop 别名\n\n示例:\n  hok alias list                   列出所有别名\n  hok alias add <名称> <命令>      添加别名\n  hok alias rm  <名称>             删除别名"
  bucket:
    about: 管理清单仓库
    args:
      add: 添加仓库
      add.name: 仓库名称
      add.repo: 仓库 URL（已知仓库可省略）
      list: 列出仓库
      list.known: 列出已知仓库
      known: "列出已知仓库（Scoop: scoop bucket known）"
      remove: 删除仓库
      remove.name: 仓库名称
  cache:
    about: 包缓存管理
    args:
      app: 要列出缓存的包名称（默认为全部）
      list: 列出下载缓存
      list.app: 列出指定包的缓存
      remove: 删除下载缓存
      remove.all: 删除所有缓存
      remove.app: 删除指定包的缓存
  cat:
    args:
      package: 要检查的包名称
    about: 查看包的清单信息
  checkhashes:
    about: 验证并更新清单哈希值
    long_about: |-
      遍历 `--dir` 下的清单，下载其声明的每个 URL，并将计算结果与 `hash` 字段比对，对标官方 Scoop 的 `bin/checkhashes.ps1`。声明了顶层 `url` 的清单只按顶层校验；其余按架构（64bit、32bit、arm64）逐个校验。
      使用 `--update` 时，哈希不匹配的清单会被原地重写（保留 CRLF 与末尾换行）；`--force` 则连哈希本就正确的清单也一并重写。
    args:
      app: |-
        要检查的特定应用（支持通配符，默认为全部）
        匹配不区分大小写（对齐官方 `-App` 过滤），可传多个模式，按 OR 组合。
      cache: |-
        对下载的文件使用缓存目录
        默认为临时目录，运行结束时删除，除非给出 `--keep-cache`。
      dir: |-
        要扫描清单的仓库目录
        默认为当前目录，但配合 `--update`/`--force`（会重写清单）时必须显式给出，否则 hok 拒绝运行。
      force: |-
        即使哈希匹配也强制更新清单
        该标志下始终重新下载，即使同时给出 `--keep-cache`。
      keep_cache: |-
        检查完成后保留下载的文件
        等价于官方 `-UseCache`：下次运行复用缓存文件而不重新下载，因此可能校验到过期的文件。缓存按清单版本区分。
      skip_correct: 不输出哈希正确的清单
      update: 发现不匹配时用正确哈希更新清单
  checkup:
    about: 检查潜在问题
  checkurls:
    about: 检查清单 URL 的有效性
    args:
      app: "要检查的特定应用（支持通配符，默认为全部）"
      dir: 要扫描清单的仓库目录
      skip_valid: 仅显示无效 URL（隐藏有效的）
      timeout: 请求超时时间（秒）
  checkver:
    about: 检查清单是否有新版本
    args:
      app: "要检查的特定应用（支持通配符，默认为全部）"
      dir: |-
        要扫描清单的仓库目录
        默认为当前目录，但配合 `--update`/`--force-update`（会重写清单）时必须显式给出，否则 hok 拒绝运行。
      update: 用新版本更新清单并触发自动更新
      force_update: 即使版本不变也强制更新（用于哈希更新场景）
      skip_updated: 跳过已是最新的清单
      version: 更新清单到指定版本（跳过版本检测）
      timeout: 请求超时秒数
      throw_error: 遇到首个错误即抛出，而不是继续处理其余清单
  cleanup:
    about: 通过删除旧版本清理应用
    args:
      app: 指定要清理的应用名称
      all: 清理所有应用（相当于 '*'）
      global: 清理全局安装的应用
      cache: 同时删除下载缓存
      list: 列出已安装的版本（不执行清理）
  completions:
    args:
      shell: Shell 类型
    about: 生成 shell 补全脚本
  config:
    about: 配置管理
    long_about: |-
      配置管理

      配置文件：~/.config/hok/config.json

      设置项
      ------

      aria2-enabled: bool，默认 true
            启用分片下载（hok 内置的 HTTP Range 分片下载器）。
      aria2-split: int，默认 5
            每次分片下载使用的连接数。
      aria2-max-connection-per-server: int，默认 5
            每个下载对单个服务器的最大连接数。
      aria2-min-split-size: 大小，默认 5M
            触发分片下载的最小文件大小（如 5M、10M）。
      jobs: int，默认 4
            下载阶段并发处理的包数。
      cache_path: 路径，默认 $SCOOP_CACHE 或 <root>/cache
            下载缓存目录。
      cat_style: 字符串，默认无
            设置后 'bat' 以这些 --style 组件显示清单（需安装 bat；
            bat 不接受的值退回纯 JSON 输出）。
      editor: 字符串，默认无
            'hok config edit' 使用的编辑器（未设置时回退 $EDITOR，再到系统处理程序）。
      confirm: bool，默认 false
            同步类操作执行前先询问确认。
      default_architecture: 64bit|32bit|arm64，默认自动检测
            安装时使用的首选架构。
      global_path: 路径，默认 $SCOOP_GLOBAL 或 %ProgramData%\scoop
            全局应用安装的根目录。
      gh_token: 字符串，默认无
            用于认证请求的 GitHub API token。
      ignore_failures: bool，默认 false
            多包操作中单个包失败时继续处理其余包。
      ignore_running_processes: bool，默认 false
            应用正在运行时仍继续（仅警告，不中止）。
      language: auto|en|zh，默认 auto
            消息与帮助文本使用的 CLI 语言。
      last_update: 字符串，内部
            上次 bucket 更新的时间戳（由 hok 管理）。
      no_color: bool，默认 false
            禁用彩色输出。
      no_junction: bool，默认 false
            不使用 'current' 目录联接；shim 直接指向版本目录。
      private_hosts: 数组，编辑文件
            需要额外认证头的私有主机；请直接编辑配置文件。
      proxy: 字符串，默认 none
            代理设置：none | default | currentuser | [username:password@]host:port。
      root_path: 路径，默认 $SCOOP 或 ~/scoop
            Scoop 根目录。
      script_engine: bool，默认 false
            复用常驻 pwsh 进程执行安装/卸载脚本。
      use_isolated_path: bool|字符串，默认无
            将应用的 PATH 条目存入专用环境变量（默认为 SCOOP_PATH）。
      use_sqlite_cache: bool，默认 false
            使用 SQLite 数据库缓存清单（兼容 Scoop 的 schema）。
      virustotal_api_key: 字符串，默认无
            用于上传/扫描文件的 VirusTotal API key。

      裸 'hok config' 以 '键 = 值' 逐行输出配置文件里实际保存的设置；'-j' 输出
      同一份内容的 JSON，'-a' 列出全部已知设置及其生效默认值。写入用
      'hok config <key> <value>'，删除用 'hok config rm <key>'，与官方
      'scoop config' 形态一致。private_hosts 和 last_update 只能直接编辑
      配置文件。

      设置名严格按上面列出的写法，没有别名。'hok config edit' 是 hok 扩展
      （官方把 'edit' 当作键名），'-j' / '-a' 同样是 hok 扩展。
    args:
      json: 以 JSON 输出设置
      all: 列出全部设置及其生效默认值
      key: 打印该设置项；后面跟值时改为写入该项
      value: <KEY> 的新值
      edit: "编辑配置文件 [默认: 系统默认编辑器]"
      rm: 从配置文件删除设置
      rm.key: 要删除的配置项名称
  create:
    about: "从下载 URL 创建清单"
    long_about: "下载文件、计算哈希并生成清单骨架。"
    args:
      url: 下载 URL
      output: "输出文件路径（可选，默认为 stdout）"
  depends:
    args:
      package: 包名称
      arch: "使用指定架构（32bit/64bit/arm64），覆盖检测到的默认架构"
    about: 显示包的依赖关系
  download:
    about: 将包下载到缓存文件夹而不安装
    long_about: |-
      将包文件下载到缓存目录而不安装（使用本地 'buckets'）：
           hok download git

      下载指定版本的包
      （注意：将基于当前版本自动生成 manifest）：
           hok download gh@2.7.0

      从 URL 的 manifest 下载包：
           hok download https://raw.githubusercontent.com/ScoopInstaller/Main/master/bucket/runat.json

      从本机 manifest 文件下载包：
           hok download \path\to\app.json
    args:
      package: 要下载的包（名称、bucket/名称、名称@版本，或 manifest URL/路径）
      force: 强制下载（覆盖缓存）
      skip_hash_check: 跳过包完整性检查
      arch: "使用指定架构（32bit/64bit/arm64），覆盖检测到的默认架构"
  export:
    about: 导出已安装包列表
    args:
      config: 同时导出配置（对齐官方 'scoop export -c'）
      hok: 追加 hok 自有扩展（配置与逐应用状态）；官方 Scoop 会忽略，hok 可完整还原
  formatjson:
    about: 格式化仓库目录中的清单 JSON 文件
    args:
      app: "要格式化的特定应用（通配符与 .json 后缀可省略，大小写不敏感；默认为全部）"
      dir: |-
        要扫描清单的仓库目录
        必填：该命令会原地重写它找到的每个清单，而扫描是递归收集所有 `*.json`，无法分辨清单与其它 JSON 文件。
  health:
    about: 检查已安装包的潜在问题
  hold:
    about: 锁定包以禁止更改
    args:
      global: 锁定全局安装的应用（来自 $SCOOP_GLOBAL）
      package: 要锁定的包
  home:
    args:
      package: 包名称
    about: 浏览包的主页
  import:
    args:
      file: "要导入的 Scoopfile：本地路径、http(s) URL 或 UNC 路径"
    about: 从 Scoopfile 导入已安装包
  info:
    args:
      query: 应用名称（也接受 `bucket/name`）、manifest URL 或本地 manifest 路径
      verbose: 显示完整路径和 URL
    about: 显示应用的信息
  install:
    about: 安装包
    long_about: |-
      从本地 bucket、manifest URL 或本地 manifest 文件安装包。

      通常的安装方式（使用本地 'buckets'）：
           hok install git

      安装指定版本的包
      （注意：将基于当前版本自动生成 manifest）：
           hok install gh@2.7.0

      从 URL 的 manifest 安装包：
           hok install https://raw.githubusercontent.com/ScoopInstaller/Main/master/bucket/runat.json

      从 URL 安装指定版本的包：
           hok install https://raw.githubusercontent.com/ScoopInstaller/Main/master/bucket/neovim.json@0.9.0

      从本机 manifest 文件安装包：
           hok install \path\to\app.json
           hok install \path\to\app.json@version
    args:
      arch: "使用指定架构（32bit/64bit/arm64），覆盖检测到的默认架构"
      assume_yes: 假设所有提示都是"是"并以非交互方式运行
      download_only: 仅下载包而不执行安装
      global: 全局安装（到 $SCOOP_GLOBAL）
      no_cache: "不使用下载缓存"
      ignore_failures: "忽略错误以确保事务完成（可持久设置：'hok config ignore_failures true'）"
      independent: 不自动安装依赖
      skip_hash_check: 跳过包完整性检查
      no_replace: 不替换包
      no_upgrade: 不升级包
      offline: 利用缓存并禁止网络访问
      package: "要安装的包（名称、bucket/名称、名称@版本，或 manifest URL/路径）"
  list:
    about: 列出已安装的包
    args:
      explicit: 关闭正则并使用精确匹配
      held: 列出被锁定的包
      query: 查询字符串（默认支持正则）
      upgradable: 列出可升级的包
      versions: 显示所有已安装版本（不仅仅是当前版本）
  missing_checkver:
    about: 检查缺少 checkver 和 autoupdate 的仓库清单
    args:
      app: 要检查的特定应用（通配符与 .json 后缀可省略，大小写不敏感；默认为全部）
      dir: 要扫描清单的仓库目录
      skip_supported: 跳过同时具有 checkver 和 autoupdate 的清单
  prefix:
    args:
      package: 包名称
    about: 显示包的安装目录
  reinstall:
    about: 重新安装包
    args:
      global: 全局安装（到 $SCOOP_GLOBAL）
      no_cache: "不使用下载缓存"
      ignore_failures: "忽略错误以确保事务完成（可持久设置：'hok config ignore_failures true'）"
      skip_hash_check: 跳过包完整性检查
      offline: 利用缓存并禁止网络访问
      package: 要重新安装的包
  reset:
    args:
      app: 应用名称
      version: 要重置到的特定版本
      all: 重置所有已安装的应用
    about: "重置应用以解决冲突（重新创建 shim、快捷方式、运行 post_install）"
  search:
    about: "搜索可用包"
    long_about: "从已同步的仓库中搜索可用包。默认按包名匹配；使用 --with-description 或 --with-binary 可同时搜索包的描述或可执行文件。"
    args:
      explicit: 关闭正则并使用精确匹配
      query: 查询字符串（默认支持正则）
      with_binary: 同时搜索包的可执行文件
      with_description: 同时搜索包的描述信息
  shim:
    about: 列出或检查 shim
    long_about: |-
      管理 Scoop shims（添加 / 移除 / 列出 / 检查）。

      示例:
        hok shim add <名称> <目标> [参数...]  添加自定义 shim，指向任意命令路径
                                              （或通过 PATH 解析的命令名）
        hok shim rm <名称>...                 移除 shims（注意: 可能移除应用清单创建的 shim）
        hok shim list [<正则模式>...]         列出所有 shims 或匹配的 shims
        hok shim info <名称>                  显示 shim 的信息

      `-g/--global` 可出现在 `--` 之前的任意位置，`hok shim -g list` 与
      `hok shim list -g` 是同一条命令，都只列出全局 shims。
      `hok shim list *` 列出全部 shims。

      提示: 第一个 `--`（若有）被当作 POSIX 风格选项终止符，不会包含在
      shim 参数中；请把 `-` 开头的参数放在它后面:
        hok shim add myapp D:\\path\\myapp.exe -- --global
    args:
      global: 操作全局 shim(s)
      add: 添加自定义 shim
      add.long_about: "`hok shim add <名称> <目标> [参数...]` — 以 `-` 开头的参数必须放在 `--`（POSIX 风格选项终止符）之后；`-g`/`--global` 本身是 hok 的选项，要传给 shim 需放在 `--` 之后。"
      add.parts: "`<名称> <目标> [参数...]` — 名称，然后是目标命令路径（或通过 PATH 解析的命令名），再后是任意参数"
      remove: "移除 shims（注意: 可能移除应用清单创建的 shim）"
      remove.names: Shim 名称
      list: 列出所有 shims（默认），可选正则过滤
      list.patterns: 用于过滤的正则模式
      info: 显示特定应用的 shim 信息
      info.name: Shim 名称
  status:
    about: 显示所有已安装应用的状态
    args:
      all: "同时显示已是最新的应用（默认仅显示过期的）"
  unhold:
    about: 解锁包以允许更改
    args:
      global: 解锁全局安装的应用（来自 $SCOOP_GLOBAL）
      package: 要解锁的包
  uninstall:
    about: 卸载包
    args:
      assume_yes: 假设所有提示都是"是"并以非交互方式运行
      global: 卸载全局安装的应用（来自 $SCOOP_GLOBAL）
      ignore_failures: "忽略错误以确保事务完成（可持久设置：'hok config ignore_failures true'）"
      skip_hash_check: 跳过包完整性检查
      package: 要卸载的包
      purge: 删除所有持久化数据
  update:
    about: "获取并更新已订阅的仓库，或升级已安装的包"
    long_about: "获取并更新已订阅的仓库，或升级已安装的包\n\n示例:\n  hok update            仅更新仓库\n  hok update <应用>     升级特定包（兼容 Scoop）\n  hok update *          升级所有包"
    args:
      assume_yes: 假设所有提示都是"是"并以非交互方式运行
      force: "即使没有新版本也强制更新"
      no_cache: "不使用下载缓存"
      ignore_failures: "忽略错误以确保事务完成（可持久设置：'hok config ignore_failures true'）"
      independent: 不自动安装依赖
      skip_hash_check: 跳过包完整性检查
      no_replace: 不替换包
      no_upgrade: 不升级包
      offline: 利用缓存并禁止网络访问
      package: 要升级的包（省略则仅更新仓库）
      global: 全局安装（到 $SCOOP_GLOBAL）
      all: 升级所有已安装的包（相当于 '*'）
  upgrade:
    about: 升级已安装的包
    args:
      all: 升级所有已安装的包（相当于 '*'）
      assume_yes: 假设所有提示都是"是"并以非交互方式运行
      force: "强制升级：对已达请求版本的包重新安装"
      global: 全局安装（到 $SCOOP_GLOBAL）
      ignore_failures: "忽略错误以确保事务完成（可持久设置：'hok config ignore_failures true'）"
      independent: 不自动安装依赖
      no_cache: "不使用下载缓存"
      skip_hash_check: 跳过包完整性检查
      offline: 利用缓存并禁止网络访问
      package: "要升级的包（默认为全部，被锁定的除外）"
  virustotal:
    about: "检查包下载 URL 是否被 VirusTotal 标记"
    long_about: |-
      需要 VirusTotal API key。设置方式:
        hok config virustotal_api_key <key>
      或设置 $VT_API_KEY 环境变量。
    args:
      app: 要检查的包名称
  which:
    about: 显示命令的 shim 位置
    args:
      command: 要查找的命令名称
  auto_pr:
    about: "通过 GitHub API 自动更新 manifest 并创建 Pull-Request（零外部二进制，CI 模式）"
    long_about: 该命令在 CI 环境（例如 GitHub Actions）中运行，仅使用 GitHub API——不需要 git/hub 二进制。
    args:
      dir: 要扫描 manifest 的 bucket 目录
      upstream: "上游仓库及目标分支 (<user>/<repo>:<branch>)"
      push: 直接推送到 origin 分支
      request: 为每个更新创建 Pull-Request
      origin_branch: 本地分支名
      message: "提交信息格式（<app> 和 <version> 会被替换）"
      skip_updated: 跳过已是最新的 manifest
      special: "强制更新指定的特殊雪花 app（逗号分隔）"
      token: "GitHub Token（默认从 GITHUB_TOKEN 环境变量读取）"
      app_slug: "GitHub App 的 slug（例如 `my-bot`）；当令牌是 GitHub App 安装令牌时，用于为对应的 bot 用户生成 DCO 签名"
      verbose: 显示每个 manifest 的 checkver 详情（找到的版本、更新、错误）

# 命令别名（用于 shell 补全）
cli_alias:
  bucket:
    List: [ls]
    Remove: [rm]
  cache:
    List: [ls]
    Remove: [rm]
  config:
    List: [ls]
  search: [s]
  uninstall: [rm, remove]
  update: [u]
