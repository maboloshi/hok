cli_help:
  heading:
    usage: "用法:"
    subcommands: "子命令"
    options: "选项"
  after_help: "输入 'hok help <命令>' 查看特定命令的帮助。"
  help:
    about: "打印此消息或给定子命令的帮助"
  hok:
    about: "Hok 是 Scoop 的 Rust 实现"
    args:
      detail: "显示详细操作信息以便调试"
      language: "强制 CLI 语言 (auto/en/zh)"
      no_color: "禁用彩色输出"
      verbose: "增加日志详细程度"
      quiet: "减少日志详细程度"
      help: "打印帮助信息"
      version: "打印版本信息"
  alias:
    args:
      command: "命令: list（默认），add，rm"
      name: 别名名称（用于 add/rm）
      value: 别名命令（用于 add）
    about: "列出、添加或删除 Scoop 别名"
    long_about: "列出、添加或删除 Scoop 别名\n\n示例:\n  hok alias list                   列出所有别名\n  hok alias add <名称> <命令>      添加别名\n  hok alias rm  <名称>             删除别名"
  bucket:
    about: 管理清单仓库
    args:
      add: 添加仓库
      list: 列出仓库
      list.known: 列出已知仓库
      known: "列出已知仓库（Scoop: scoop bucket known）"
      remove: 删除仓库
      remove.name: 仓库名称
  cache:
    about: 包缓存管理
    args:
      list: 列出下载缓存
      remove: 删除下载缓存
      remove.all: 删除所有缓存
  cat:
    args:
      package: 要检查的包名称
    about: 查看包的清单信息
  checkhashes:
    about: 验证并更新清单哈希值
    args:
      app: "要检查的特定应用（支持通配符，默认为全部）"
      cache: 对下载的文件使用缓存目录
      dir: 要扫描清单的仓库目录
      force: 即使哈希匹配也强制更新清单（重新哈希）
      update: 发现不匹配时用正确哈希更新清单
  checkup:
    about: 检查已安装包的潜在问题
  checkurls:
    about: 检查清单 URL 的有效性
    args:
      app: "要检查的特定应用（支持通配符，默认为全部）"
      dir: 要扫描清单的仓库目录
      skip_valid: 仅显示无效 URL（隐藏有效的）
      timeout: 请求超时时间（秒）
  checkver:
    about: 检查清单是否有新版本
    args:
      app: "要检查的特定应用（支持通配符，默认为全部）"
      dir: 要扫描清单的仓库目录
      update: 用新版本更新清单并触发自动更新
      force-update: 即使版本不变也强制更新（用于哈希更新场景）
      skip-updated: 跳过已是最新的清单
      version: 更新清单到指定版本（跳过版本检测）
      timeout: 请求超时秒数
  cleanup:
    about: 通过删除旧版本清理应用
    args:
      app: 指定要清理的应用名称（留空表示全部）
      all: 清理所有应用
      global: 清理全局安装的应用
      cache: 同时删除下载缓存
  completions:
    args:
      shell: Shell 类型
    about: 生成 shell 补全脚本
  config:
    about: 配置管理
    long_about: |-
      配置管理

      配置文件：~/.config/hok/config.json

      设置项
      ------

      aria2-enabled: bool，默认 true
            启用分片下载（hok 内置的 HTTP Range 分片下载器）。
      aria2-split: int，默认 5
            每次分片下载使用的连接数。
      aria2-max-connection-per-server: int，默认 5
            每个下载对单个服务器的最大连接数。
      aria2-min-split-size: 大小，默认 5M
            触发分片下载的最小文件大小（如 5M、10M）。
      cache_path: 路径，默认 $SCOOP_CACHE 或 <root>/cache
            下载缓存目录。
      cat_style: 字符串，默认无
            设置后使用 'bat' 显示清单（需安装 bat）。
      default_architecture: 64bit|32bit|arm64，默认自动检测
            安装时使用的首选架构。
      global_path: 路径，默认 $SCOOP_GLOBAL 或 %ProgramData%\scoop
            全局应用安装的根目录。
      gh_token: 字符串，默认无
            用于认证请求的 GitHub API token。
      ignore-failures: bool，默认 true
            多包操作中单个包失败时继续处理其余包。
      ignore_running_processes: bool，默认 false
            应用正在运行时仍继续（仅警告，不中止）。
      language: auto|en|zh，默认 auto
            消息与帮助文本使用的 CLI 语言。
      last_update: 字符串，内部
            上次 bucket 更新的时间戳（由 hok 管理）。
      no-color: bool，默认 false
            禁用彩色输出。
      no_junction: bool，默认 false
            不使用 'current' 目录联接；shim 直接指向版本目录。
      output-style: scoop|pacman，默认 scoop
            进度与状态消息的输出样式。
      private_hosts: 数组，编辑文件
            需要额外认证头的私有主机；请直接编辑配置文件。
      proxy: 字符串，默认 none
            代理设置：none | default | currentuser | [username:password@]host:port。
      root_path: 路径，默认 $SCOOP 或 ~/scoop
            Scoop 根目录。
      use_isolated_path: bool|字符串，默认无
            将应用的 PATH 条目存入专用环境变量（默认为 SCOOP_PATH）。
      use_sqlite_cache: bool，默认 false
            使用 SQLite 数据库缓存清单（兼容 Scoop 的 schema）。
      virustotal_api_key: 字符串，默认无
            用于上传/扫描文件的 VirusTotal API key。

      大多数设置可通过 'hok config set <key> <value>' 修改（空值表示取消
      设置）。private_hosts 和 last_update 只能直接编辑配置文件。运行
      'hok config list --all' 查看当前值与生效默认值。
    args:
      edit: "编辑配置文件 [默认: 系统默认编辑器]"
      list: "以键值对形式列出所有设置（--all 同时显示默认值）"
      list.all: 同时显示每个设置生效的默认值
      set: 向配置文件添加新设置
      unset: 从配置文件删除设置
  create:
    about: "从下载 URL 创建清单  下载文件、计算哈希并生成清单骨架。"
    args:
      url: 下载 URL
      output: "输出文件路径（可选，默认为 stdout）"
  depends:
    args:
      package: 包名称
      arch: "使用指定架构（32bit/64bit/arm64），覆盖检测到的默认架构"
    about: 显示包的依赖关系
  download:
    about: 将包下载到缓存文件夹而不安装
    long_about: |-
      将包文件下载到缓存目录而不安装（使用本地 'buckets'）：
           hok download git

      下载指定版本的包
      （注意：将基于当前版本自动生成 manifest）：
           hok download gh@2.7.0

      从 URL 的 manifest 下载包：
           hok download https://raw.githubusercontent.com/ScoopInstaller/Main/master/bucket/runat.json

      从本机 manifest 文件下载包：
           hok download \path\to\app.json
    args:
      package: 要下载的包（名称、bucket/名称、名称@版本，或 manifest URL/路径）
      force: 强制下载（覆盖缓存）
      no_hash_check: 跳过包完整性检查
      arch: "使用指定架构（32bit/64bit/arm64），覆盖检测到的默认架构"
  export:
    about: 导出已安装包列表
    args:
      all: 包含非仓库包（URL/路径安装）
  formatjson:
    about: 格式化仓库目录中的清单 JSON 文件
    args:
      app: "要格式化的特定应用（支持通配符，默认为全部）"
      dir: 要扫描清单的仓库目录
  hold:
    about: 锁定包以禁止更改
    args:
      package: 要锁定的包
  home:
    args:
      package: 包名称
    about: 浏览包的主页
  import:
    args:
      file: 要导入的 JSON 文件
    about: 从文件导入已安装包
  info:
    args:
      query: 查询字符串（支持正则）
    about: 显示包的基本信息
  install:
    about: 安装包
    long_about: |-
      从本地 bucket、manifest URL 或本地 manifest 文件安装包。

      通常的安装方式（使用本地 'buckets'）：
           hok install git

      安装指定版本的包
      （注意：将基于当前版本自动生成 manifest）：
           hok install gh@2.7.0

      从 URL 的 manifest 安装包：
           hok install https://raw.githubusercontent.com/ScoopInstaller/Main/master/bucket/runat.json

      从 URL 安装指定版本的包：
           hok install https://raw.githubusercontent.com/ScoopInstaller/Main/master/bucket/neovim.json@0.9.0

      从本机 manifest 文件安装包：
           hok install \path\to\app.json
           hok install \path\to\app.json@version
    args:
      arch: "使用指定架构（32bit/64bit/arm64），覆盖检测到的默认架构"
      assume_yes: 假设所有提示都是"是"并以非交互方式运行
      download_only: 仅下载包而不执行安装
      escape_hold: 绕过锁定以允许更改被锁定的包
      global: 全局安装（到 $SCOOP_GLOBAL）
      ignore_cache: 忽略缓存并强制下载
      ignore_failure: 忽略错误以确保事务完成
      independent: 不安装依赖（可能破坏包）
      no_hash_check: 跳过包完整性检查
      no_replace: 不替换包
      no_upgrade: 不升级包
      offline: 利用缓存并禁止网络访问
      package: "要安装的包（名称、bucket/名称、名称@版本，或 manifest URL/路径）"
  list:
    about: 列出已安装的包
    args:
      explicit: 关闭正则并使用精确匹配
      held: 列出被锁定的包
      query: 查询字符串（默认支持正则）
      upgradable: 列出可升级的包
      versions: 显示所有已安装版本（不仅仅是当前版本）
  missing_checkver:
    about: 检查缺少 checkver 和 autoupdate 的仓库清单
    args:
      dir: 要扫描清单的仓库目录
      supported: 仅显示具有 checkver/autoupdate 的清单（反向筛选）
  prefix:
    args:
      package: 包名称
    about: 显示包的安装目录
  reinstall:
    about: 重新安装包
    args:
      ignore_cache: 忽略缓存并强制下载
      ignore_failure: 忽略错误以确保事务完成
      no_hash_check: 跳过包完整性检查
      offline: 利用缓存并禁止网络访问
      package: 要重新安装的包
  reset:
    args:
      app: 应用名称
      version: 要重置到的特定版本
      all: 重置所有已安装的应用
    about: "重置应用以解决冲突（重新创建 shim、快捷方式、运行 post_install）"
  search:
    about: "搜索可用包"
    args:
      explicit: 关闭正则并使用精确匹配
      query: 查询字符串（默认支持正则）
      with_binary: 同时搜索包的可执行文件
      with_description: 同时搜索包的描述信息
  shim:
    about: 列出或检查 shim
    long_about: |-
      管理 Scoop shims（添加 / 移除 / 列出 / 检查）。

      子命令:
        add <名称> <目标> [参数...]  添加自定义 shim，指向任意命令路径
                                     （或通过 PATH 解析的命令名）
        rm <名称>...                 移除 shims（注意: 可能移除应用清单创建的 shim）
        list [<正则模式>...]         列出所有 shims 或匹配的 shims
        info <名称>                   显示 shim 的信息

      选项:
        -g, --global  操作全局 shim(s)

      提示: 第一个 `--`（若有）被当作 POSIX 风格选项终止符，不会包含在
      shim 参数中；请把 `-` 开头的参数放在它后面:
        hok shim add myapp D:\\path\\myapp.exe -- --global
    args:
      global: 操作全局 shim(s)
      add: 添加自定义 shim
      add.parts: "`<名称> <目标> [参数...]` — 名称，然后是目标命令路径（或通过 PATH 解析的命令名），再后是任意参数"
      remove: "移除 shims（注意: 可能移除应用清单创建的 shim）"
      remove.names: Shim 名称
      list: 列出所有 shims（默认），可选正则过滤
      list.patterns: 用于过滤的正则模式
      info: 显示特定应用的 shim 信息
      info.name: Shim 名称
  status:
    about: 显示所有已安装应用的状态
    args:
      all: "同时显示已是最新的应用（默认仅显示过期的）"
  unhold:
    about: 解锁包以允许更改
    args:
      package: 要解锁的包
  uninstall:
    about: 卸载包
    args:
      escape_hold: 绕过锁定以允许更改被锁定的包
      ignore_failure: 忽略错误以确保事务完成
      no_hash_check: 跳过包完整性检查
      package: 要卸载的包
  update:
    about: "获取并更新已订阅的仓库，或升级已安装的包"
    long_about: "获取并更新已订阅的仓库，或升级已安装的包\n\n示例:\n  hok update            仅更新仓库\n  hok update <应用>     升级特定包（兼容 Scoop）\n  hok update *          升级所有包"
    args:
      assume_yes: 假设所有提示都是"是"并以非交互方式运行
      escape_hold: 绕过锁定以允许升级被锁定的包
      force: "强制更新：绕过冷却期并重装已达请求版本的软件"
      ignore_cache: 忽略缓存并强制下载
      ignore_failure: 忽略错误以确保事务完成
      independent: 不安装依赖（可能破坏包）
      no_hash_check: 跳过包完整性检查
      no_replace: 不替换包
      no_upgrade: 不升级包
      offline: 利用缓存并禁止网络访问
      package: 要升级的包（省略则仅更新仓库）
      global: 全局安装（到 $SCOOP_GLOBAL）
      all: 升级所有已安装的包（相当于 '*'）
  upgrade:
    about: 升级已安装的包
    args:
      assume_yes: 假设所有提示都是"是"并以非交互方式运行
      escape_hold: 绕过锁定以允许升级被锁定的包
      ignore_failure: 忽略错误以确保事务完成
      no_hash_check: 跳过包完整性检查
      offline: 利用缓存并禁止网络访问
      package: "要升级的包（默认为全部，被锁定的除外）"
  virustotal:
    about: "检查包下载 URL 是否被 VirusTotal 标记"
    args:
      app: 要检查的包名称
  which:
    about: 显示命令的 shim 位置
  ciautopr:
    about: "通过 GitHub API 自动更新 manifest 并创建 Pull-Request（零外部二进制，CI 模式）"
    args:
      dir: 要扫描 manifest 的 bucket 目录
      upstream: "上游仓库及目标分支 (<user>/<repo>:<branch>)"
      push: 直接推送到 origin 分支
      request: 为每个更新创建 Pull-Request
      origin_branch: 本地分支名
      message: "提交信息格式（<app> 和 <version> 会被替换）"
      skip_updated: 跳过已是最新的 manifest
      special: "强制更新指定的特殊雪花 app（逗号分隔）"
      token: "GitHub Token（默认从 GITHUB_TOKEN 环境变量读取）"

# 命令别名（用于 shell 补全）
cli_alias:
  bucket:
    List: [ls]
    Remove: [rm]
  cache:
    List: [ls]
    Remove: [rm]
  config:
    List: [ls]
  search: [s]
  uninstall: [rm, remove]
  update: [u]
