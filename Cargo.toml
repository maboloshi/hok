[package]
name = "hok"
description = "Hok is a CLI implementation of Scoop in Rust"
repository = "https://github.com/maboloshi/hok"
version = "0.2.0-beta.1"
authors = ["Chawye Hsu <su+cratesio@chawyehsu.com>", "沙漠之子 <7850715+maboloshi@users.noreply.github.com>"]
license = "Apache-2.0"
edition = "2021"
readme = "README.md"

[workspace]
members = ["crates/libscoop", "crates/scoop_hash", "crates/hok-shim", "crates/hok-i18n-derive"]

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["wrap_help", "cargo", "derive", "string"] }
clap-verbosity-flag = { version = "3.0.1", features = ["tracing"], default-features = false }
clap_complete = "4.5.38"
crossterm = "0.28"
indicatif = "0.17.9"
json5 = "0.4"
jsonpath-rust = "1.0"
regex = { version = "1.5.3", default-features = false, features = ["std", "unicode-case", "perf"] }
serde = "1.0"
serde_json = { version = "1.0.120", features = ["preserve_order"] }
scoop-hash = { version = "0.2.0-alpha.1", path = "./crates/scoop_hash" }
sxd-document = "0.3"
sxd-xpath = "0.4"
ureq = { version = "3", features = ["json"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

rust-i18n = "3.1.5"
sys-locale = "0.3"

hok-i18n-derive = { path = "./crates/hok-i18n-derive" }

[build-dependencies]
jiff = "0.2"

[dependencies.libscoop]
version = "0.2.0-beta.1"
path = "./crates/libscoop"

[profile.release]
debug = false       # 无调试信息（等同于 -C debuginfo=0）
incremental = false # 禁用增量编译
lto = "fat"          # 胖 LTO：跨 crate 全局优化（等效 -C lto=true）
panic = "abort"      # 禁用栈展开，减小体积
opt-level = "z"      # 按体积优化（等效 -C opt-level=z）
strip = "symbols"    # 剥离符号表
codegen-units = 1    # 单代码单元，最大化 LTO 效果

[profile.release.package.hok-shim]
opt-level = "z"
codegen-units = 1
incremental = false

[profile.dev]
panic = "abort"

[profile.release-debug]
inherits = "release"
debug = true
strip = false




