[package]
name = "libscoop"
description = "Rust library implementation of Scoop"
repository = "https://github.com/maboloshi/hok"
documentation = "https://docs.rs/libscoop"
version = "0.2.0"
authors = ["Chawye Hsu <su+cratesio@chawyehsu.com>", "沙漠之子 <7850715+maboloshi@users.noreply.github.com>"]
categories = ["command-line-utilities"]
keywords = ["package-manager", "windows", "scoop"]
license = "MIT OR Apache-2.0"
edition = "2024"
readme = "README.md"

[dependencies]
# curl = { version = "0.4", features = ["static-curl"] }
time = { workspace = true, features = ["formatting", "parsing", "macros", "local-offset"] }
# Phase 4 (方案 B): async traits + reqwest (真 async I/O) + concurrency.
async-trait = "0.1"
futures = "0.3"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "macros", "sync"] }
# Cooperative cancellation (P2): CancellationToken threaded through downloads,
# scripts and waits so Ctrl-C aborts cleanly (temp files, cursor, subprocesses).
tokio-util = { workspace = true, features = ["rt"] }
git2 = "0.19.0"
rayon = "1.7.0"
regex = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = "2"
tracing = { workspace = true }
# Async HTTP client (phase 4): async `Network` impl + GitHub / VirusTotal APIs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip"] }
jsonpath-rust = "1.0"
json5 = "0.4"
sxd-document = "0.3"
sxd-xpath = "0.4"
base64 = "0.22"
rust-i18n = { workspace = true }
md-5 = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }

# Archive — pure Rust crates (no cmake/bindgen needed)
sevenz-rust2 = { version = "0.21", default-features = false, features = ["aes256", "bzip2", "ppmd", "util"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = { version = "0.4", default-features = false }
# flate2 unified on the pure-Rust zlib-rs backend across the workspace
# (libscoop, upstream nsis 0.4, vendored innospect, zip), so miniz_oxide
# stays out of the tree entirely.
flate2 = { workspace = true }
lzma-rust2 = { workspace = true, features = ["xz"] }
unrar = "0.5"
zstd = { version = "0.13", default-features = false }
bzip2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
junction = "1.2.0"
# 0.56 accepts `windows-sys >=0.59, <=0.61`, so it unifies with the direct
# dependency below instead of pulling a second copy.
winreg = "0.56"
# Native Windows ACL APIs (GetNamedSecurityInfoW/SetEntriesInAclW/
# SetNamedSecurityInfoW) for `permission::grant_users_write_inherit` —
# keeps the ACL grant a pure-Rust call instead of shelling out to icacls.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }
# Vendored fork of inno-rs (0.1.2) with LZMA/Zlib decoders switched to
# lzma-rust2 + flate2/zlib-rs (faster, removes miniz_oxide from the tree).
# Upstream: https://github.com/BinFlip/inno-rs
innospect = { path = "../innospect" }
# Upstream nsis-rs 0.4.0 (registry): adopted our lzma-rust2/zlib-rs PR
# (upstream commit 201df25) plus dest_path/solid-truncation fixes, so the
# vendored fork (crates/nsis) is retired. Upstream: https://github.com/ATRAPSLLC/nsis-rs
nsis = "0.4"
shortcuts-rs = "1.1.1"

[build-dependencies]
hok-shim = { path = "../hok-shim" }
serde_json = { workspace = true }

[features]
default = []

[lints.rust]
unsafe_code = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[dev-dependencies]
# Guardrail benchmarks for the key pure functions (phase 5). Dev-only — never
# affects release builds. `cargo bench` runs them.
criterion = "0.8"

[[bench]]
name = "pure_functions"
harness = false

[[bench]]
name = "event_emission"
harness = false
