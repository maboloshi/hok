[package]
name = "libscoop"
description = "Rust library implementation of Scoop"
repository = "https://github.com/maboloshi/hok"
documentation = "https://docs.rs/libscoop"
version = "0.2.0-beta.3"
authors = ["Chawye Hsu <su+cratesio@chawyehsu.com>", "沙漠之子 <7850715+maboloshi@users.noreply.github.com>"]
categories = ["command-line-utilities"]
keywords = ["package-manager", "windows", "scoop"]
license = "MIT OR Apache-2.0"
edition = "2021"
readme = "README.md"

[dependencies]
# curl = { version = "0.4", features = ["static-curl"] }
dirs = "5.0.1"
flume = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
git2 = "0.19.0"
rayon = "1.7.0"
regex = { version = "1.5.3", default-features = false, features = ["std", "unicode-case", "perf"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.120", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1.41"
ureq = { version = "3", features = ["json"] }
jsonpath-rust = "1.0"
json5 = "0.4"
sxd-document = "0.3"
sxd-xpath = "0.4"
base64 = "0.22"
rust-i18n = "3.1.5"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"

# Archive — pure Rust crates (no cmake/bindgen needed)
sevenz-rust2 = { version = "0.21", default-features = false, features = ["aes256", "bzip2", "ppmd", "util"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = { version = "0.4", default-features = false }
# flate2 unified on the pure-Rust zlib-rs backend. Note: miniz_oxide still
# enters the tree because innospect and ureq declare flate2 with default
# features (rust_backend); feature unification cannot remove it project-side —
# upstream would need `default-features = false`.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
lzma-rs = "0.3"
unrar = "0.5"
zstd = { version = "0.13", default-features = false }
bzip2 = "0.6.1"

[target.'cfg(windows)'.dependencies]
junction = "1.2.0"
winreg = "0.52"
innospect = "0.1"
nsis = "0.3"
shortcuts-rs = "1.1.1"

[build-dependencies]
hok-shim = { path = "../hok-shim" }
serde_json = "1.0"

[features]
default = []

[lints.rustdoc]
broken_intra_doc_links = "deny"
