[package]
name = "hok-shim"
version = "0.3.0"
edition = "2024"
description = "Shim launcher for hok"

# The shared core lives in src/lib.rs; the two variants only differ by the
# PE subsystem:
# - hok-shim (console)  — console targets, shell waits, interactive works
# - hok-shim-gui (GUI)  — GUI targets, no console window, shell does not wait
[[bin]]
name = "hok-shim"
path = "src/bin/hok-shim.rs"

[[bin]]
name = "hok-shim-gui"
path = "src/bin/hok-shim-gui.rs"

[dependencies]

# `hok-shim` is a `no_std` Win32 FFI shim generator — unsafe is inherent.
# The crate-level `#![allow(unsafe_code)]` in `src/lib.rs` (and both bins)
# deliberately overrides this deny; see the audit in
# .agents/docs/active/audit/unsafe-audit.md.
[lints.rust]
unsafe_code = "deny"
