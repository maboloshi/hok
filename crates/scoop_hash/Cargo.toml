[package]
name = "scoop-hash"
description = "Hashing library for libscoop"
repository = "https://github.com/maboloshi/hok"
version = "0.2.0-beta.1"
authors = ["Chawye Hsu <su+cratesio@chawyehsu.com>", "沙漠之子 <7850715+maboloshi@users.noreply.github.com>"]
categories = ["cryptography"]
keywords = ["hash", "scoop"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.60.0"
readme = "README.md"

[[bench]]
name = "all"
path = "benches/all.rs"
harness = false

[dependencies]
md-5 = { version = "0.11", optional = true }
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }

[dev-dependencies]
criterion = "0.4"

[features]
default = ["rustcrypto"]
# The "rustcrypto" feature enables hash implementations from RustCrypto's crates.
rustcrypto = ["md-5", "sha1", "sha2"]
