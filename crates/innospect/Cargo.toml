[package]
edition = "2024"
rust-version = "1.88"
name = "innospect"
version = "0.1.2"
authors = ["Johann Kempter <admin@binflip.rs>"]
build = false
exclude = [
    "tests/samples/",
    "reference/",
    "research/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Parse and inspect Inno Setup installer binaries"
readme = "README.md"
keywords = [
    "inno-setup",
    "installer",
    "parser",
    "reverse-engineering",
    "binary-analysis",
]
categories = ["parser-implementations"]
license = "Apache-2.0"
repository = "https://github.com/BinFlip/inno-rs"

[lib]
name = "innospect"
path = "src/lib.rs"

[[test]]
