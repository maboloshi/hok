[package]
name = "innospect"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "Parse and inspect Inno Setup installer binaries"
license = "Apache-2.0"
repository = "https://github.com/ATRAPSLLC/innospect"
readme = "README.md"
keywords = ["inno-setup", "installer", "parser", "reverse-engineering", "binary-analysis"]
categories = ["parser-implementations"]
exclude = ["tests/samples/", "reference/", "research/"]

# innospect is used in malware-analysis pipelines where every input byte
# is adversarial. These lints prevent the parser from panicking on
# malformed input. The `cfg_attr(test, allow(...))` escape hatch in
# `src/lib.rs` lets tests still use `unwrap`/`expect`/`panic` for terseness.
# This crate also denies `unsafe_code`.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"

[dependencies]
bitflags = "2.13.0"
# `codepage` only pulls encoding_rs with `default-features = false`, which
# removes the `alloc`-gated `decode*` methods used by `records/language.rs`;
# the direct dependency re-enables them.
encoding_rs = "0.8.35"
codepage = "0.1.2"
flate2 = { workspace = true }
lzma-rust2 = { workspace = true }
bzip2 = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }
pbkdf2 = { version = "0.13.0", default-features = false }
hmac = "0.13.0"
chacha20 = { version = "0.10.1", features = ["xchacha"] }
pascalscript = "0.1.2"

[dev-dependencies]
lzma-rs = "0.3"
