name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and upload (e.g. v0.2.0-beta.2)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: |
          cargo build -p hok-shim --release
          cargo build -p hok --release

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ inputs.tag }} `
            target/release/hok.exe `
            --clobber
