name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and upload (e.g. v0.2.0-beta.2)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Published binaries link the SQLite that ships with Windows instead of
      # compiling the bundled amalgamation (about 1 MB smaller). The script
      # stages the SDK's winsqlite3, sets the three libsqlite3-sys variables for
      # its own process only, builds hok-shim + hok, and -Verify asserts that
      # the result really imports winsqlite3.dll. Only x64/arm64 can do this: on
      # x86 the winsqlite3 import library exports __stdcall-decorated names that
      # rusqlite's cdecl bindings cannot resolve (see crates/libscoop/build.rs).
      - name: Build release (winsqlite3 shape)
        run: pwsh scripts/build-hok.ps1 -Mode winsqlite3 -Verify

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ inputs.tag }} `
            target/release/hok.exe `
            --clobber
